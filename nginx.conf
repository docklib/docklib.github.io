# Canonical hint for the raw Basket Random game folder (served from /var/www/games).
# Points to the wrapper page. The synced game files are not edited. Empty value = no header.
map $uri $canon_link {
    default "";
    "/Games11/basketrandom/"           '<https://sz-games.com/BasketRandom.html>; rel="canonical"';
    "/Games11/basketrandom/index.html" '<https://sz-games.com/BasketRandom.html>; rel="canonical"';
}

server {
    listen 80;
    server_name sz-games.com www.sz-games.com localhost;

    # Security headers (repeated in the .html location: add_header there overrides these)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        application/wasm;

    # Root for main website files
    root /var/www/html;
    index index.html;

    # Health check endpoint for Kamal & monitoring
    location = /v1/health {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    # Custom MIME types for Unity WebGL, Flash, and Wasm
    types {
        text/html                             html htm shtml;
        text/css                              css;
        text/xml                              xml;
        image/gif                             gif;
        image/jpeg                            jpeg jpg;
        application/javascript                js;
        application/atom+xml                  atom;
        application/rss+xml                   rss;
        text/mathml                           mml;
        text/plain                            txt;
        text/vnd.sun.j2me.app-descriptor      jad;
        text/vnd.wap.wml                      wml;
        text/x-component                      htc;
        image/png                             png;
        image/svg+xml                         svg svgz;
        image/tiff                            tif tiff;
        image/vnd.wap.wbmp                    wbmp;
        image/webp                            webp;
        image/x-icon                          ico;
        image/x-jng                           jng;
        image/x-ms-bmp                        bmp;
        application/wasm                      wasm;
        application/octet-stream              data unityweb bin;
        application/x-shockwave-flash         swf;
        audio/midi                            mid midi kar;
        audio/mpeg                            mp3;
        audio/ogg                             ogg;
        audio/x-m4a                           m4a;
        audio/x-realaudio                     ra;
        video/3gpp                            3gpp 3gp;
        video/mp4                             mp4;
        video/mpeg                            mpeg mpg;
        video/quicktime                       mov;
        video/webm                            webm;
        video/x-flv                           flv;
        video/x-m4v                           m4v;
        video/x-mng                           mng;
        video/x-ms-asf                        asx asf;
        video/x-ms-wmv                        wmv;
        video/x-msvideo                       avi;
    }

    # HTML files: no-cache to always serve fresh content
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ @games;
    }

    # ads.txt: ensure exact plain text
    location = /ads.txt {
        default_type text/plain;
        expires 1h;
        try_files $uri =404;
    }

    # Main location: try local site files first, fall back to persistent games storage
    location / {
        try_files $uri $uri/ @games;
    }

    # Fallback to games mounted storage
    location @games {
        root /var/www/games;
        add_header Link $canon_link;
        try_files $uri $uri/ @games_legacy;
    }

    # Fallback to legacy server games storage
    location @games_legacy {
        root /var/www/legacy_games;
        add_header Link $canon_link;
        try_files $uri $uri/ =404;
    }

    # Error pages
    error_page 404 /404.html;
}
