name: Deploy (Kamal)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Kamal Deploy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The runner is an ephemeral container, already on the tailnet as tag:ci. Do not run
      # tailscale/github-action here: a second `tailscale up` aborts the job.
      - name: Verify GitHub Actions API reachable
        run: |
          getent hosts api.github.com
          getent hosts broker.actions.githubusercontent.com
          curl -fsS --connect-timeout 5 -o /dev/null https://github.com

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # MagicDNS is off on the runner, so map the host's Tailscale IP by hand.
      - name: Configure SSH Host
        run: |
          echo "100.102.209.88 themarzlibrary themarzlibrary.tail4d7dbc.ts.net" | sudo tee -a /etc/hosts
          mkdir -p ~/.ssh
          cat << 'SSHCONFIG' >> ~/.ssh/config
          Host *
            StrictHostKeyChecking accept-new

          Host themarzlibrary themarzlibrary.tail4d7dbc.ts.net 100.102.209.88
            HostName 100.102.209.88
            User kamal
          SSHCONFIG

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Kamal 2 and the 1Password CLI are baked into the runner image; nothing is
      # installed here. Do not prune BuildKit: the host Docker socket is shared.
      - name: Run Kamal Deploy
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
        run: |
          kamal deploy

      - name: Smoke test
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://sz-games.com/ || true)
            echo "Attempt $attempt: HTTP $status"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Smoke test failed: expected HTTP 200" >&2
          exit 1
