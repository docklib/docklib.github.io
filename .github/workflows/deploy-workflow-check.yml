name: Deploy workflow check

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tailscale-action:
    name: Tailscale action version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check deploy workflow
        run: bash scripts/check-tailscale-action.sh .github/workflows/deploy.yml
