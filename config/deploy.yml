# Kamal 2 deployment for sz-games.com (docklib.github.io)
service: sz-games
image: senty-au/sz-games

servers:
  web:
    hosts:
      - themarzlibrary
    options:
      memory: 64m

proxy:
  host: sz-games.com, www.sz-games.com
  app_port: 80
  ssl: false
  healthcheck:
    path: /v1/health
    interval: 5
    timeout: 3
  # Shared kamal-proxy on this host: keep this run block identical to the
  # other themarzlibrary apps, or a reboot from one app reverts the others.
  run:
    version: v0.10.0
    http_port: 8082
    https_port: 8443
    metrics_port: 1318
    bind_ips:
      - 127.0.0.1
    options:
      env: GOMEMLIMIT=64MiB

registry:
  server: ghcr.io
  username: rusya13
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  context: .

volumes:
  - /srv/sz-games-assets:/var/www/games:ro
  - /srv/themarzlibrary-assets:/var/www/legacy_games:ro

ssh:
  user: kamal
